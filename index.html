/* --------------------
CALCULAR ACIERTOS
-------------------- */

function calcularAciertos() {
  const semana = semanaSelect.value;
  const datos = JSON.parse(localStorage.getItem("semana" + semana)) || [];

  let aciertos = 0;

  datos.forEach(j => {
    if (!j) return;

    // ✅ Solo contar 1 acierto por juego
    if (j.pick && j.ganador) {
      // Si el pick coincide con el ganador, suma 1
      if (j.pick === j.ganador) {
        aciertos++;
      }
    }
  });

  // Actualizar display
  aciertosDisplay.textContent = `🏆 ${aciertos}/${totalJuegosSemana}`;
}

/* --------------------
ESPN API
-------------------- */

async function obtenerJuegosSemana(){

  try{

    const yearActual = new Date().getFullYear();

    const res = await fetch(
      "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&year=" + yearActual + "&week=" + semanaSelect.value
    );

    const data = await res.json();

    return data.events;

  }catch(e){

    console.log("Error ESPN", e);

    return [];

  }

}

async function obtenerDrive(id){

try{

const res = await fetch(  
"https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event="+id  
);  

const data = await res.json();  

return data;

}catch(e){

return null;

}

}

        t.porcentaje = ((t.G + (t.E * 0.5)) / juegos);

    }

});
      
      dataSemana[i] = {
        ...dataSemana[i],
        local: local.team.abbreviation,
        visitante: visitante.team.abbreviation,
        ganador: ganador
      };
      localStorage.setItem("semana" + semana, JSON.stringify(dataSemana));
      calcularAciertos();

      marcador.innerHTML += "<br><strong>Final</strong>";
    }

    // ─── Mostrar drive en vivo si existe ───
    const resumen = await obtenerDrive(evento.id);
    if (resumen && resumen.drives && resumen.drives.current) {
      const drive = resumen.drives.current;
      const equipo = drive.team?.abbreviation || "";
      const down = drive.start?.downDistanceText || "";
      driveDiv.innerHTML = `🏈 ${equipo} ball<br>${down}`;
    }

  });
}

  function actualizarPosicionesNFL(){

    // Reiniciar estadísticas
    for(const equipo in posicionesNFL){

        posicionesNFL[equipo].G = 0;
        posicionesNFL[equipo].P = 0;
        posicionesNFL[equipo].E = 0;
        posicionesNFL[equipo].porcentaje = 0;

    }

    // Revisar las 18 semanas
    for(let semana=1; semana<=18; semana++){

        const juegos = JSON.parse(localStorage.getItem("semana"+semana)) || [];

        juegos.forEach(juego=>{

            if(!juego) return;
            if(!juego.ganador) return;

            if(juego.ganador==="Local"){

                posicionesNFL[juego.local].G++;
                posicionesNFL[juego.visitante].P++;

            }

            else if(juego.ganador==="Visitante"){

                posicionesNFL[juego.visitante].G++;
                posicionesNFL[juego.local].P++;

            }

            else{

                posicionesNFL[juego.local].E++;
                posicionesNFL[juego.visitante].E++;

            }

        });

    }

    // Calcular porcentaje
    for(const equipo in posicionesNFL){

            datos.P +
            datos.E;

        }

    }

const visitante = compo.competitors.find(t => t.homeAway === "away");

  if(document.getElementById(`balon-${i}`)){

  function moverBalon(idJuego, nuevaYarda){

  const balon = document.getElementById(`balon-${idJuego}`);
  if(!balon) return;

  const nuevaPos = (nuevaYarda / 100) * 100;

  balon.style.transition = "left 0.6s ease"; // 🔥 animación suave
  balon.style.left = nuevaPos + "%";
}
